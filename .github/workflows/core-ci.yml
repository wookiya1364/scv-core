name: SCV Core CI

on:
  pull_request:
    branches: [main, stage, develop]
  workflow_dispatch:

permissions:
  contents: read

# A superseded run has nothing left to prove. Without this, editing a PR (or
# reopening it to re-fire a gate) leaves the previous run grinding through the
# full matrix for a tree nobody will merge.
concurrency:
  group: core-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # WHERE THE SUITE ACTUALLY EARNS ITS TIME.
  #
  # The permanent branches are a chain — develop → stage → main — and a promotion
  # PR carries a tree develop already proved. Re-running the whole matrix at every
  # hop cost ~8 full runs per release and proved the same thing three times.
  #
  # So the suite runs where a tree is NEW, and is skipped where it is a copy:
  #   • any PR into develop        — new code enters here
  #   • fix/* → main               — a hotfix legitimately bypasses develop/stage,
  #                                  so this tree was never proved anywhere else
  #   • workflow_dispatch          — asked for by hand
  # Skipped: develop → stage and stage → main, which carry a proved tree.
  #
  # There is no push trigger. A PR check runs against the MERGE RESULT, and the
  # branch ruleset now requires a PR to be up to date with its base before it can
  # merge — so the tree a PR proved is the tree that lands. Re-running on the push
  # afterwards proved the same commit a second time. (While "up to date" was off,
  # two independently-green PRs could merge back to back and leave a tree nobody
  # had tested; that hole is what the push run used to cover, and it is now closed
  # at the source instead.)
  #
  # The JOBS still run and still report — the branch ruleset lists them as required
  # checks, and a job that never reports blocks the merge forever. Only the heavy
  # STEPS are gated, so a skipped run finishes in seconds instead of minutes.
  SCV_CI_FULL: >-
    ${{ github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.base_ref == 'develop')
      || (github.event_name == 'pull_request' && github.base_ref == 'main' && startsWith(github.head_ref, 'fix/')) }}

jobs:
  # WHERE THE CONTRACTS TIME GOES — and why it is split across runners.
  #
  # Contract tests, the shared regression and the focused suites ran one after another
  # on one runner: 13 minutes on ubuntu, 15–16 on macOS. Overlapping them on that one
  # runner barely helped — the tests share its CPU, so each one slows down (macOS: the
  # tests' own times summed to 719 s run one by one, 1397 s overlapped three at a time).
  # Separate runners each bring their own CPU, so the work is cut into shards, balanced
  # by core/tests/timings.tsv, and each shard runs its part one test at a time — which
  # also keeps the wall-clock checks inside some tests steady.
  #
  # macOS shards stop at five: the account runs at most five macOS jobs at once — nine
  # shards measured 400 s because four of them queued behind the first five.
  #
  # The branch ruleset requires "Contracts (ubuntu-latest)" and "Contracts (macos-latest)".
  # Those two names now belong to small result jobs that wait for their shards and
  # report one verdict, so the ruleset does not change.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      full: ${{ steps.lane.outputs.full }}
      macos: ${{ steps.lane.outputs.macos }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Decide the lane
        id: lane
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_only=no; macos=yes
          if [[ "$SCV_CI_FULL" == "true" && -n "$BASE_SHA" ]]; then
            lane="$(bash tools/ci-plan.sh "$BASE_SHA" "$HEAD_SHA")"
            docs_only="$(printf '%s\n' "$lane" | sed -n 's/^docs_only=//p')"
            macos="$(printf '%s\n' "$lane" | sed -n 's/^macos=//p')"
          fi
          full=false
          [[ "$SCV_CI_FULL" == "true" && "$docs_only" != "yes" ]] && full=true
          [[ "$full" == "true" ]] || macos=no
          echo "lane: SCV_CI_FULL=$SCV_CI_FULL docs_only=$docs_only → full=$full macos=$macos"
          { echo "full=$full"; echo "docs_only=$docs_only"; echo "macos=$macos"; } >> "$GITHUB_OUTPUT"
      # A docs- or version-only PR skips the heavy shards, but the checks that read
      # those documents still run here.
      - name: Documents a docs-only change can break
        if: steps.lane.outputs.docs_only == 'yes'
        run: |
          bash tools/check-readme.sh --profile core .
          bash core/scripts/check-frontmatter.sh --project-dir .
          bash tests/test-guard-consistency.sh

  shards-ubuntu:
    name: Shard (ubuntu ${{ matrix.shard }}/6)
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
      - name: Shell syntax and this repository's own plans
        if: matrix.shard == 1
        run: |
          find core/scripts core/tests tests tools -type f -name '*.sh' -exec bash -n {} +
          bash core/scripts/check-frontmatter.sh --project-dir .
      - name: Contracts, shared regression and focused suites (this shard)
        run: bash core/tests/run-focused.sh --dir tests --dir core/tests --also core/tests/run-dry.sh --shard ${{ matrix.shard }}/6

  shards-macos:
    name: Shard (macos ${{ matrix.shard }}/5)
    needs: plan
    # Only a PR that changes code needs macOS: the BSD/GNU and bash 3.2 differences live
    # in code, so a Markdown- or VERSION-only change runs on ubuntu alone (tools/ci-plan.sh).
    if: needs.plan.outputs.full == 'true' && needs.plan.outputs.macos == 'yes'
    runs-on: macos-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
      - name: Install modern Bash on macOS
        run: |
          brew list bash >/dev/null 2>&1 || brew install bash
          modern_bash="$(brew --prefix)/bin/bash"
          "$modern_bash" -c 'test "${BASH_VERSINFO[0]}" -ge 4'
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Shell syntax and this repository's own plans
        if: matrix.shard == 1
        run: |
          find core/scripts core/tests tests tools -type f -name '*.sh' -exec bash -n {} +
          bash core/scripts/check-frontmatter.sh --project-dir .
      - name: Contracts, shared regression and focused suites (this shard)
        run: bash core/tests/run-focused.sh --dir tests --dir core/tests --also core/tests/run-dry.sh --shard ${{ matrix.shard }}/5 --timings core/tests/timings-macos.tsv

  contracts-ubuntu:
    name: Contracts (ubuntu-latest)
    needs: [plan, shards-ubuntu]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verdict
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          FULL: ${{ needs.plan.outputs.full }}
          SHARDS: ${{ needs.shards-ubuntu.result }}
        run: |
          echo "plan=$PLAN_RESULT full=$FULL shards=$SHARDS"
          [[ "$PLAN_RESULT" == "success" ]] || exit 1
          if [[ "$FULL" == "true" ]]; then [[ "$SHARDS" == "success" ]]; else [[ "$SHARDS" == "skipped" ]]; fi

  contracts-macos:
    name: Contracts (macos-latest)
    needs: [plan, shards-macos]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verdict
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          FULL: ${{ needs.plan.outputs.full }}
          MACOS: ${{ needs.plan.outputs.macos }}
          SHARDS: ${{ needs.shards-macos.result }}
        run: |
          echo "plan=$PLAN_RESULT full=$FULL macos=$MACOS shards=$SHARDS"
          [[ "$PLAN_RESULT" == "success" ]] || exit 1
          if [[ "$FULL" == "true" && "$MACOS" == "yes" ]]; then [[ "$SHARDS" == "success" ]]; else [[ "$SHARDS" == "skipped" ]]; fi

  deckui:
    name: DeckUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The toolchain steps carry the same gate as the build steps. Without it a
      # fast-lane run (SCV_CI_FULL false — e.g. the develop → stage promotion PR)
      # sets up pnpm caching, never installs anything, and setup-node's post step
      # then fails the job with "Path Validation Error: path(s) … do not exist"
      # because there is no store to save. That broke the 0.47.0 promotion chain.
      - uses: pnpm/action-setup@v4
        if: env.SCV_CI_FULL == 'true'
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: env.SCV_CI_FULL == 'true'
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: |
            core/DeckUI/pnpm-lock.yaml
            core/DeckUI/scripts/deckdoc/pnpm-lock.yaml

      - name: Install DeckUI dependencies
        if: env.SCV_CI_FULL == 'true'
        run: |
          pnpm -C core/DeckUI install --frozen-lockfile
          pnpm -C core/DeckUI/scripts/deckdoc install --frozen-lockfile

      - name: Typecheck and build
        if: env.SCV_CI_FULL == 'true'
        run: |
          pnpm -C core/DeckUI typecheck
          pnpm -C core/DeckUI build:deck

      - name: Deck document regression
        if: env.SCV_CI_FULL == 'true'
        run: bash core/tests/test-deck-doc.sh

  artifact:
    name: Deterministic release artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build twice and compare
        run: |
          tools/release-artifact.sh --output-dir "$RUNNER_TEMP/one"
          tools/release-artifact.sh --output-dir "$RUNNER_TEMP/two"
          cmp "$RUNNER_TEMP"/one/*.tar.gz "$RUNNER_TEMP"/two/*.tar.gz
          diff -u "$RUNNER_TEMP"/one/*.sha256 "$RUNNER_TEMP"/two/*.sha256

      - name: Inspect payload hygiene
        run: |
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf "$RUNNER_TEMP"/one/*.tar.gz -C "$RUNNER_TEMP/unpacked"
          if find "$RUNNER_TEMP/unpacked" -type d \
            \( -name node_modules -o -name dist -o -name dist-deck -o -name coverage -o -name .vite -o -name .cache \) \
            -print -quit | grep -q .; then
            echo "development directory leaked into release" >&2
            exit 1
          fi
          generated_decks=$(find "$RUNNER_TEMP/unpacked" \
            -path '*/DeckUI/src/deck/decks/*/deck.json' \
            ! -path '*/DeckUI/src/deck/decks/demo-prd/deck.json' \
            ! -path '*/DeckUI/src/deck/decks/refund/deck.json' -print)
          test -z "$generated_decks" || {
            echo "generated DeckUI deck leaked into release: $generated_decks" >&2
            exit 1
          }
          if find "$RUNNER_TEMP/unpacked" ! -type f ! -type d -print -quit | grep -q .; then
            echo "link or special file leaked into release" >&2
            exit 1
          fi
