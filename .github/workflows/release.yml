name: Release SCV Core

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SCV_WRAPPER_SYNC_TOKEN: ${{ secrets.SCV_WRAPPER_SYNC_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            core/DeckUI/pnpm-lock.yaml
            core/DeckUI/scripts/deckdoc/pnpm-lock.yaml

      - name: Validate tag
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Verify Core
        run: |
          bash tests/run.sh
          bash core/tests/run-dry.sh
          for test_file in core/tests/test-*.sh; do
            bash "$test_file"
          done

      - name: Verify DeckUI
        run: |
          pnpm -C core/DeckUI install --frozen-lockfile
          pnpm -C core/DeckUI/scripts/deckdoc install --frozen-lockfile
          pnpm -C core/DeckUI typecheck
          pnpm -C core/DeckUI build:deck
          bash core/tests/test-deck-doc.sh

      - name: Build deterministic artifacts
        run: tools/release-artifact.sh --output-dir dist

      - name: Publish GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --title "SCV Core $GITHUB_REF_NAME" \
              --generate-notes
          fi

      # Neither an `if:` guard on the secret nor `continue-on-error`. A missing
      # secret used to make this step `skipped` and the run green — the exact
      # state this repository sat in unnoticed until 2026-08-11. "The wrappers
      # were not notified" is now one signal: this step fails, so the run fails.
      # Publishing happens above, so a red run here still leaves the release
      # assets complete, and re-running takes the `--clobber` upload path.
      - name: Dispatch wrapper update workflows
        env:
          GH_TOKEN: ${{ env.SCV_WRAPPER_SYNC_TOKEN }}
        run: |
          # No `set -e` here on purpose: the default shell is `bash -e {0}`, so an
          # unguarded failure on the first repository would abort the loop and the
          # second wrapper would never be attempted. Every wrapper must get its
          # own independent try; the collected result decides the step's exit.
          set -uo pipefail
          if [ -z "${SCV_WRAPPER_SYNC_TOKEN:-}" ]; then
            echo "::error::SCV_WRAPPER_SYNC_TOKEN is not configured; neither wrapper was notified."
            exit 1
          fi
          version=$(tr -d '[:space:]' < VERSION)
          asset_url="https://github.com/wookiya1364/scv-core/releases/download/v${version}/scv-core-v${version}.tar.gz"
          checksum_url="${asset_url}.sha256"
          failed=""
          for repository in scv-claude-code scv-codex; do
            sent=""
            for attempt in 1 2 3; do
              if gh api --method POST "repos/wookiya1364/${repository}/dispatches" \
                  -f event_type=scv-core-released \
                  -F "client_payload[version]=$version" \
                  -f "client_payload[tag]=v$version" \
                  -f "client_payload[asset_url]=$asset_url" \
                  -f "client_payload[checksum_url]=$checksum_url"; then
                sent=yes
                echo "dispatched ${repository} (attempt ${attempt})"
                break
              fi
              [ "$attempt" -lt 3 ] && sleep $((attempt * 5))
            done
            if [ -z "$sent" ]; then
              failed="${failed}${failed:+, }${repository}"
              echo "::error::Failed to notify ${repository} after 3 attempts."
            fi
          done
          if [ -n "$failed" ]; then
            {
              echo "### Wrapper dispatch failed"
              echo
              echo "Not notified: **${failed}**"
              echo
              echo "The release itself is published and intact — only the wrapper"
              echo "notification failed. Check \`SCV_WRAPPER_SYNC_TOKEN\`, then re-send:"
              echo
              echo '```'
              echo "gh api --method POST repos/wookiya1364/<wrapper>/dispatches \\"
              echo "  -f event_type=scv-core-released \\"
              echo "  -F client_payload[version]=${version} \\"
              echo "  -f client_payload[tag]=v${version} \\"
              echo "  -f client_payload[asset_url]=${asset_url} \\"
              echo "  -f client_payload[checksum_url]=${checksum_url}"
              echo '```'
              echo
              echo "Wrappers also self-heal by polling: both wrappers poll daily."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
