name: Release SCV Core

on:
  push:
    tags:
      - 'v*'
  # A PR that edits this file rehearses the verify shards below — the release job itself
  # never runs on a PR. Without this, a change to the shards is first exercised by a real
  # tag, when a mistake already blocks a release.
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  # WHERE THE RELEASE WAITS — and why it is split across runners (0.92.1).
  #
  # One runner used to run every test one after another before anything was published:
  # 19–23 minutes through 2026-11-10, 32m33s for v0.92.0. Release assets appear only after
  # that, and the wrappers' sync starts from the assets, so both wrappers waited as long.
  # The tests are independent of each other, so they are cut into shards exactly as the PR
  # check does (core-ci.yml): same runner script, same folders, one runner per shard, one
  # test at a time inside a shard — which keeps the wall-clock checks in some tests steady.
  # Balanced by core/tests/timings.tsv, a shard is about a sixth of the tests' summed time.
  # v0.92.1, the first run in shards: 200–252 s per shard, 284 s for the whole run (1,986 s
  # before). The 252 s shard held the one test that could not be cut (203–256 s) plus many
  # small tests the table had at 0 s. 0.92.2 split that test into four files and re-wrote the
  # table from this job's own times — tests/test-release-verify.sh fails when a test is missing
  # from the table, when one test outgrows half a shard, or when the shards drift apart.
  #
  # What changes besides the wait: the old loop ran `core/tests/test-*.sh`, so the two
  # aggregate files (`# scv-test: aggregate`) ran their parts a second time — 225 s of
  # repeated work. The runner script skips aggregates; every part still runs once.
  #
  # pnpm and Node are set up in every shard on purpose. The deck tests skip themselves when
  # pnpm is missing (they do on the PR shards), and this step is where they actually run —
  # so the shards keep the environment the single verify step had. No `cache:` here: a shard
  # that installs nothing has no store to save, and setup-node's post step fails the job on
  # that ("Path Validation Error" — the same trap the DeckUI job in core-ci.yml documents).
  #
  # `release` needs every shard. A failed or cancelled shard means no assets and no wrapper
  # dispatch; `gh run rerun <id> --failed` re-runs only the shards that failed.
  verify:
    name: Verify Core (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Validate tag
        if: github.event_name == 'push'
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Contracts, shared regression and focused suites (this shard)
        run: bash core/tests/run-focused.sh --dir tests --dir core/tests --also core/tests/run-dry.sh --shard ${{ matrix.shard }}/6

  release:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SCV_WRAPPER_SYNC_TOKEN: ${{ secrets.SCV_WRAPPER_SYNC_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: |
            core/DeckUI/pnpm-lock.yaml
            core/DeckUI/scripts/deckdoc/pnpm-lock.yaml

      - name: Validate tag
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Verify DeckUI
        run: |
          pnpm -C core/DeckUI install --frozen-lockfile
          pnpm -C core/DeckUI/scripts/deckdoc install --frozen-lockfile
          pnpm -C core/DeckUI typecheck
          pnpm -C core/DeckUI build:deck
          bash core/tests/test-deck-doc.sh

      - name: Build deterministic artifacts
        run: tools/release-artifact.sh --output-dir dist

      - name: Publish GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --title "SCV Core $GITHUB_REF_NAME" \
              --generate-notes
          fi

      # Neither an `if:` guard on the secret nor `continue-on-error`. A missing
      # secret used to make this step `skipped` and the run green — the exact
      # state this repository sat in unnoticed until 2026-08-11. "The wrappers
      # were not notified" is now one signal: this step fails, so the run fails.
      # Publishing happens above, so a red run here still leaves the release
      # assets complete, and re-running takes the `--clobber` upload path.
      - name: Dispatch wrapper update workflows
        env:
          GH_TOKEN: ${{ env.SCV_WRAPPER_SYNC_TOKEN }}
        run: |
          # No `set -e` here on purpose: the default shell is `bash -e {0}`, so an
          # unguarded failure on the first repository would abort the loop and the
          # second wrapper would never be attempted. Every wrapper must get its
          # own independent try; the collected result decides the step's exit.
          set -uo pipefail
          if [ -z "${SCV_WRAPPER_SYNC_TOKEN:-}" ]; then
            echo "::error::SCV_WRAPPER_SYNC_TOKEN is not configured; neither wrapper was notified."
            exit 1
          fi
          version=$(tr -d '[:space:]' < VERSION)
          asset_url="https://github.com/wookiya1364/scv-core/releases/download/v${version}/scv-core-v${version}.tar.gz"
          checksum_url="${asset_url}.sha256"
          failed=""
          for repository in scv-claude-code scv-codex; do
            sent=""
            for attempt in 1 2 3; do
              if gh api --method POST "repos/wookiya1364/${repository}/dispatches" \
                  -f event_type=scv-core-released \
                  -F "client_payload[version]=$version" \
                  -f "client_payload[tag]=v$version" \
                  -f "client_payload[asset_url]=$asset_url" \
                  -f "client_payload[checksum_url]=$checksum_url"; then
                sent=yes
                echo "dispatched ${repository} (attempt ${attempt})"
                break
              fi
              [ "$attempt" -lt 3 ] && sleep $((attempt * 5))
            done
            if [ -z "$sent" ]; then
              failed="${failed}${failed:+, }${repository}"
              echo "::error::Failed to notify ${repository} after 3 attempts."
            fi
          done
          if [ -n "$failed" ]; then
            {
              echo "### Wrapper dispatch failed"
              echo
              echo "Not notified: **${failed}**"
              echo
              echo "The release itself is published and intact — only the wrapper"
              echo "notification failed. Check \`SCV_WRAPPER_SYNC_TOKEN\`, then re-send:"
              echo
              echo '```'
              echo "gh api --method POST repos/wookiya1364/<wrapper>/dispatches \\"
              echo "  -f event_type=scv-core-released \\"
              echo "  -F client_payload[version]=${version} \\"
              echo "  -f client_payload[tag]=v${version} \\"
              echo "  -f client_payload[asset_url]=${asset_url} \\"
              echo "  -f client_payload[checksum_url]=${checksum_url}"
              echo '```'
              echo
              echo "Wrappers also self-heal by polling: both wrappers poll daily."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
