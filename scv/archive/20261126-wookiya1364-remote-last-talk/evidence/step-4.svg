<svg xmlns="http://www.w3.org/2000/svg" width="720" height="226" viewBox="0 0 720 226" font-family="-apple-system, sans-serif">
<rect width="720" height="226" fill="#fcfcfb"/>
<text x="20" y="34" font-size="17" font-weight="500" fill="#0b0b0b">원격에도 직전 대화 — 시험과 저장 글</text>
<text x="290" y="70" font-size="12" text-anchor="end" fill="#52514e">모드 시험 통과</text>
<rect x="300" y="56" width="117" height="16" rx="3" fill="#2a78d6"/>
<text x="425" y="69" font-size="12" fill="#0b0b0b">256</text>
<text x="290" y="96" font-size="12" text-anchor="end" fill="#52514e">모드 시험 실패</text>
<rect x="300" y="82" width="0" height="16" rx="3" fill="#2a78d6"/>
<text x="308" y="95" font-size="12" fill="#0b0b0b">0</text>
<text x="290" y="122" font-size="12" text-anchor="end" fill="#52514e">새 시험</text>
<rect x="300" y="108" width="1" height="16" rx="3" fill="#2a78d6"/>
<text x="309" y="121" font-size="12" fill="#0b0b0b">3</text>
<text x="290" y="148" font-size="12" text-anchor="end" fill="#52514e">저장 글 전(글자)</text>
<rect x="300" y="134" width="24" height="16" rx="3" fill="#2a78d6"/>
<text x="332" y="147" font-size="12" fill="#0b0b0b">53</text>
<text x="290" y="174" font-size="12" text-anchor="end" fill="#52514e">저장 글 후 예시(글자)</text>
<rect x="300" y="160" width="300" height="16" rx="3" fill="#2a78d6"/>
<text x="608" y="173" font-size="12" fill="#0b0b0b">654</text>
<text x="290" y="200" font-size="12" text-anchor="end" fill="#52514e">긴 답 508자 → 남는 글자</text>
<rect x="300" y="186" width="137" height="16" rx="3" fill="#2a78d6"/>
<text x="445" y="199" font-size="12" fill="#0b0b0b">300</text>
</svg>
