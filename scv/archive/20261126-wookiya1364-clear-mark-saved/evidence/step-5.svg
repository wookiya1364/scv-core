<svg xmlns="http://www.w3.org/2000/svg" width="720" height="226" viewBox="0 0 720 226" font-family="-apple-system, sans-serif">
<rect width="720" height="226" fill="#fcfcfb"/>
<text x="20" y="34" font-size="17" font-weight="500" fill="#0b0b0b">대시보드 시험 — 고치기 전 256개 → 고친 뒤 265개, 모두 통과</text>
<text x="290" y="70" font-size="12" text-anchor="end" fill="#52514e">전 통과</text>
