<text x="597" y="69" font-size="12" fill="#0b0b0b">256</text>
<text x="290" y="96" font-size="12" text-anchor="end" fill="#52514e">뒤 통과</text>
<rect x="300" y="82" width="300" height="16" rx="3" fill="#2a78d6"/>
<text x="608" y="95" font-size="12" fill="#0b0b0b">265</text>
<text x="290" y="122" font-size="12" text-anchor="end" fill="#52514e">뒤 실패</text>
<rect x="300" y="108" width="0" height="16" rx="3" fill="#2a78d6"/>
<text x="308" y="121" font-size="12" fill="#0b0b0b">0</text>
<text x="290" y="148" font-size="12" text-anchor="end" fill="#52514e">새 시험</text>
<rect x="300" y="134" width="10" height="16" rx="3" fill="#2a78d6"/>
<text x="318" y="147" font-size="12" fill="#0b0b0b">9</text>
<text x="290" y="174" font-size="12" text-anchor="end" fill="#52514e">타입 오류 전</text>
<rect x="300" y="160" width="11" height="16" rx="3" fill="#2a78d6"/>
<text x="319" y="173" font-size="12" fill="#0b0b0b">10</text>
