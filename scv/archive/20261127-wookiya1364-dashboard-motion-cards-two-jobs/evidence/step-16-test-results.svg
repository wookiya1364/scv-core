<text x="300" y="332" font-size="12" fill="#0b0b0b">시험 파일 5개 통과</text>

<text x="20" y="368" font-size="13" font-weight="500" fill="#0b0b0b">시간 측정 시험(선택 답 18줄을 적는 시간, 한도 2,000 ms)</text>
