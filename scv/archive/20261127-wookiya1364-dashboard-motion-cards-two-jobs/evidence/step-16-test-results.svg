<text x="20" y="450" font-size="12" fill="#52514e">이번 변경이 이 시간에 더한 몫은 약 4 ms(CPU 시간으로 측정). 확인하지 못한 것: 실제 창 녹화(17단계) · 원격 화면 · codex</text>
