<text x="20" y="34" font-size="17" font-weight="500" fill="#0b0b0b">16단계 — 시험을 더해 돌린 결과 (2026-11-27 23:42)</text>

<text x="20" y="66" font-size="13" font-weight="500" fill="#0b0b0b">대시보드 모드 시험 — 319개 통과 · 실패 0</text>
