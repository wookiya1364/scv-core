<svg xmlns="http://www.w3.org/2000/svg" width="720" height="174" viewBox="0 0 720 174" font-family="-apple-system, sans-serif">
<rect width="720" height="174" fill="#fcfcfb"/>
<text x="20" y="34" font-size="17" font-weight="500" fill="#0b0b0b">앞에서 오래 기다리는 호출 — 가드의 판정 (시험 입력 9개)</text>
<text x="290" y="70" font-size="12" text-anchor="end" fill="#52514e">거절해야 할 호출을 거절</text>
<rect x="300" y="56" width="225" height="16" rx="3" fill="#2a78d6"/>
<text x="533" y="69" font-size="12" fill="#0b0b0b">3</text>
<text x="290" y="96" font-size="12" text-anchor="end" fill="#52514e">통과해야 할 호출을 통과</text>
<rect x="300" y="82" width="300" height="16" rx="3" fill="#2a78d6"/>
<text x="608" y="95" font-size="12" fill="#0b0b0b">4</text>
<text x="290" y="122" font-size="12" text-anchor="end" fill="#52514e">끄는 설정에서 통과</text>
<rect x="300" y="108" width="150" height="16" rx="3" fill="#2a78d6"/>
<text x="458" y="121" font-size="12" fill="#0b0b0b">2</text>
<text x="290" y="148" font-size="12" text-anchor="end" fill="#52514e">틀린 판정</text>
<rect x="300" y="134" width="0" height="16" rx="3" fill="#2a78d6"/>
<text x="308" y="147" font-size="12" fill="#0b0b0b">0</text>
</svg>
